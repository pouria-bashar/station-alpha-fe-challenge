<svg width="24" height="24" viewBox="0 0 24 24" fill="none"
     xmlns="http://www.w3.org/2000/svg">
  <!-- Rotating rays -->
  <g stroke="#FFA500" stroke-width="2" stroke-linecap="round">
    <g>
      <animateTransform attributeName="transform" type="rotate"
        from="0 12 12" to="360 12 12" dur="8s" repeatCount="indefinite"/>
      <line x1="12" y1="2" x2="12" y2="5"/>
      <line x1="12" y1="19" x2="12" y2="22"/>
      <line x1="2" y1="12" x2="5" y2="12"/>
      <line x1="19" y1="12" x2="22" y2="12"/>
      <line x1="4.2" y1="4.2" x2="6.5" y2="6.5"/>
      <line x1="17.5" y1="17.5" x2="19.8" y2="19.8"/>
      <line x1="4.2" y1="19.8" x2="6.5" y2="17.5"/>
      <line x1="17.5" y1="6.5" x2="19.8" y2="4.2"/>
    </g>
  </g>
  <!-- Sun core -->
  <circle cx="12" cy="12" r="5" fill="#FFA500" stroke="#FFA500" stroke-width="1.5"/>
</svg>